  #tv { position: relative; width: 790px; height: 800px; overflow: visible }

  .design { left: 29.62px; top: 75.48px; width: 626.497px; height: 515.017px; mask-position: 24.495px 21.323px; -webkit-mask-position: 24.495px 21.323px; overflow: hidden }

<script>
  // Corners of the screen in the mask's own space (dark/01452.svg): the TV is seen three-quarters, so the picture follows the glass
  const QUAD = [[10, 1], [576.5, 20], [570.5, 472.4], [23, 425]]
  const W = 660, H = 495
  const solve = (A, b) => {
    const n = b.length
    for (let i = 0; i < n; i++) {
      let m = i
      for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r
      ;[A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]]
      for (let r = i + 1; r < n; r++) {
        const f = A[r][i] / A[i][i]
        for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]
        b[r] -= f * b[i]
      }
    }
    const x = Array(n).fill(0)
    for (let i = n - 1; i >= 0; i--) x[i] = (b[i] - A[i].slice(i + 1).reduce((s, v, k) => s + v * x[i + 1 + k], 0)) / A[i][i]
    return x
  }
  const src = [[0, 0], [W, 0], [W, H], [0, H]]
  const A = [], b = []
  src.forEach(([x, y], i) => {
    const [u, v] = QUAD[i]
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u)
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v)
  })
  const [a, bb, c, d, e, f, g, h] = solve(A, b)
  document.getElementById('screen').style.transform = `matrix3d(${[a, d, 0, g, bb, e, 0, h, 0, 0, 1, 0, c, f, 0, 1].join(',')})`
</script>
