# The daily row of the README. The day turns at midnight UTC on cinetropes (daily.service.ts, getEndOfDayUTC), and
# the API only answers for the current day: a reveal run keeps the day's answer in the Actions cache under its day,
# never in the repository, since that game is still on; a today run draws the new riddle with yesterday's answer
# under it and commits images/daily.webp. Scheduled runs can start hours late, so the reveal runs three times a day
name: daily

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '30 20 * * *'
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: reveal or today
        required: true
        default: today
        type: choice
        options: [today, reveal]

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '15 0 * * *' && 'today' || 'reveal') }}
    defaults:
      run:
        working-directory: tools/daily
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/daily/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y webp
        if: env.MODE == 'today'

      - id: yesterday
        if: env.MODE == 'today'
        run: echo "day=$(curl -s https://daily.cinetropes.com/api/daily | node -pe "JSON.parse(require('fs').readFileSync(0)).gameDay - 1")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        if: env.MODE == 'today'
        with:
          path: tools/daily/state
          key: daily-reveal-${{ steps.yesterday.outputs.day }}
          restore-keys: daily-reveal-

      - run: node daily.mjs ${{ env.MODE }}

      - id: kept
        if: env.MODE == 'reveal'
        run: echo "day=$(node -pe "JSON.parse(require('fs').readFileSync('state/day.json')).gameDay")" >> "$GITHUB_OUTPUT"

      # A second reveal of the same day finds its key taken, and keeps the first
      - uses: actions/cache/save@v4
        if: env.MODE == 'reveal'
        with:
          path: tools/daily/state
          key: daily-reveal-${{ steps.kept.outputs.day }}

      - name: Commit the new row
        if: env.MODE == 'today'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../../images/daily.webp
          git diff --cached --quiet && exit 0
          day=$(curl -s https://daily.cinetropes.com/api/daily | node -pe "JSON.parse(require('fs').readFileSync(0)).gameDay")
          git commit -m "chore(profile): draw cinetropes daily #$day"
          git push
